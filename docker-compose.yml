services:
  # Laravel PHP-FPM App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pratama_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      - PHP_OPCACHE_ENABLE=1
    networks:
      - pratama_network
    depends_on:
      mysql:
        condition: service_healthy

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: pratama_nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pratama_network
    depends_on:
      - app

  # MySQL 8 Database
  mysql:
    image: mysql:8.0
    container_name: pratama_mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: pratama_design_db
      MYSQL_USER: pratama_user
      MYSQL_PASSWORD: pratama_pass
      MYSQL_ROOT_PASSWORD: pratama_root_pass
    volumes:
      - pratama_mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upratama_user", "-ppratama_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pratama_network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pratama_phpmyadmin
    restart: unless-stopped
    ports:
      - "8091:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: pratama_user
      PMA_PASSWORD: pratama_pass
      MYSQL_ROOT_PASSWORD: pratama_root_pass
    networks:
      - pratama_network
    depends_on:
      mysql:
        condition: service_healthy

networks:
  pratama_network:
    driver: bridge

volumes:
  pratama_mysql_data:
    driver: local
